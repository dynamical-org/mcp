[project]
name = "dynamical-mcp-server"
version = "0.1.2"
description = "Remote MCP server exposing dynamical.org's public STAC catalog and docs as LLM tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.28.0",
    "httpx>=0.27",
    # Sentry telemetry (error tracking + Sentry Logs). Imported lazily in
    # server/obs.py, which is only called from the deployed Modal app, so local
    # dev and tests don't depend on Sentry being reachable.
    "sentry-sdk>=2.63.0",
]

[project.urls]
Homepage = "https://dynamical.org/catalog"
Repository = "https://github.com/dynamical-org/mcp"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "respx>=0.21",
    "modal>=1.4.1",
]

[project.scripts]
dynamical-mcp-server = "server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
